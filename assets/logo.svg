<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Mountain Peak Gradient (Emerald to Cyan) -->
    <linearGradient id="peakGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Mountain Facet (Light side) -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Mountain Facet (Shadow side) -->
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Secondary Peak Gradient -->
    <linearGradient id="subPeakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>

    <!-- AI Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Squircle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.2" />
    </filter>

    <!-- Subtle Inner Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#10b981" stroke-opacity="0.25" stroke-width="2" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#innerGlow)" />

  <!-- Background Secondary Mountains (Suleiman Range Silhouette) -->
  <path d="M 80 370 L 175 240 L 265 370 Z" fill="url(#subPeakGrad)" opacity="0.6" />
  <path d="M 255 370 L 340 255 L 432 370 Z" fill="url(#subPeakGrad)" opacity="0.45" />

  <!-- Main Suleiman Mountain Peak (Left light facet) -->
  <path d="M 256 150 L 140 370 L 256 370 Z" fill="url(#facetLight)" />

  <!-- Main Suleiman Mountain Peak (Right shadow facet) -->
  <path d="M 256 150 L 372 370 L 256 370 Z" fill="url(#facetDark)" />

  <!-- Center Ridge Highlight Line -->
  <line x1="256" y1="150" x2="256" y2="370" stroke="#ecfdf5" stroke-width="3" stroke-linecap="round" opacity="0.75" />

  <!-- Flowing AI Synapse Arc (Dynamic stylized Balochi curve) -->
  <path d="M 120 355 C 190 395 322 395 392 355 C 330 380 182 380 120 355 Z" fill="#6ee7b7" opacity="0.6" />

  <!-- Glowing AI Spark at the Summit (Intelligence Star) -->
  <circle cx="256" cy="146" r="32" fill="url(#sparkGlow)" />
  <path d="M 256 116 Q 256 146 226 146 Q 256 146 256 176 Q 256 146 286 146 Q 256 146 256 116 Z" fill="#ffffff" />
  <circle cx="256" cy="146" r="4.5" fill="#fef08a" />
</svg>
